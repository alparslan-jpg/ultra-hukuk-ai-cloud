<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRA HUKUK AI - Yeni Şifre Belirle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-[#131d31] border border-slate-800 rounded-2xl p-8 space-y-5">
    <div class="text-center space-y-1">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="text-lg font-bold text-slate-100">Yeni Şifre Belirleyin</h1>
      <p class="text-xs text-slate-400">Geçici şifrenizle giriş yaptınız. Panele erişebilmek için kalıcı bir şifre belirlemeniz zorunludur.</p>
    </div>

    <div class="space-y-3">
      <input id="curPw" type="password" placeholder="Geçici / Mevcut Şifre" autocomplete="current-password"
        class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-slate-200">
      <input id="newPw" type="password" placeholder="Yeni Şifre (en az 8 karakter)" autocomplete="new-password"
        class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-slate-200">
      <input id="newPw2" type="password" placeholder="Yeni Şifre (Tekrar)" autocomplete="new-password"
        class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-slate-200"
        onkeydown="if(event.key==='Enter') doChangePassword()">
      <button onclick="doChangePassword()" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold py-3 rounded-xl transition">
        <i class="fa-solid fa-check"></i> Şifreyi Güncelle ve Devam Et
      </button>
      <div id="cpError" class="text-xs text-rose-400 text-center"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
    if (!token) { window.location.href = '/login.html'; }

    async function doChangePassword() {
      const currentPassword = document.getElementById('curPw').value;
      const newPassword = document.getElementById('newPw').value;
      const newPassword2 = document.getElementById('newPw2').value;
      const errBox = document.getElementById('cpError');
      errBox.innerText = '';

      if (!currentPassword || !newPassword || !newPassword2) { errBox.innerText = 'Tüm alanlar zorunludur.'; return; }
      if (newPassword !== newPassword2) { errBox.innerText = 'Yeni şifreler eşleşmiyor.'; return; }
      if (newPassword.length < 8) { errBox.innerText = 'Yeni şifre en az 8 karakter olmalıdır.'; return; }

      try {
        const res = await fetch('/api/adminauth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        const data = await res.json();

        if (!res.ok || !(data.success || data.Success)) {
          errBox.innerText = data.message || data.Message || 'Şifre değiştirilemedi.';
          return;
        }

        window.location.href = '/admin.html';
      } catch (e) {
        errBox.innerText = 'Sunucuya ulaşılamadı: ' + e.message;
      }
    }
  </script>
</body>
</html>
